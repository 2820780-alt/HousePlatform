<style>
  :root {
    --m2-bg: #050917;
    --m2-surface: #0e1c35;
    --m2-surface-raised: #172b43;
    --m2-line: rgba(119, 172, 255, .22);
    --m2-text: #eef7ff;
    --m2-muted: #a4b7d0;
    --m2-green: #4ade80;
    --m2-cyan: #18d7f2;
    --m2-amber: #fbbf24;
    --m2-red: #fb7185;
    --m2-blue: #78adff;
  }
  * { box-sizing: border-box; }
  body[data-module2-workbench] {
    margin: 0;
    min-height: 100vh;
    color: var(--m2-text);
    font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
    background: var(--m2-bg);
  }
  body[data-module2-workbench] a { color: inherit; }
  .m2-layout { display: grid; grid-template-columns: clamp(248px, 16vw, 296px) minmax(0, 1fr); min-height: calc(100vh - 64px); }
  .m2-sidebar { position: sticky; top: 64px; align-self: start; display: grid; align-content: start; gap: 8px; min-height: calc(100vh - 64px); padding: 24px 14px; border-right: 1px solid rgba(24, 215, 242, .14); background: linear-gradient(180deg, #081634, #040c1f); }
  .m2-sidebar-title { display: grid; gap: 7px; padding: 0 10px 20px; }
  .m2-sidebar-items { display: grid; align-content: start; gap: 8px; }
  .m2-mobile-menu { display: none; }
  .m2-nav-heading { display: flex; align-items: center; gap: 4px; }
  .m2-nav-heading .m2-nav-link { flex: 1; min-width: 0; }
  .m2-nav-toggle { width: 34px; height: 36px; flex: 0 0 34px; color: var(--m2-muted); background: transparent; border: 0; border-radius: 4px; cursor: pointer; }
  .m2-nav-toggle:hover, .m2-nav-toggle[aria-expanded="true"] { color: var(--m2-text); background: var(--m2-surface-raised); }
  .m2-submenu { display: grid; gap: 2px; padding: 4px 0 4px 14px; }
  .m2-submenu a { padding: 7px 10px; color: var(--m2-muted); font-size: 13px; text-decoration: none; }
  .m2-submenu a:hover { color: var(--m2-text); }
  .m2-sidebar-title small { color: var(--m2-muted); font-size: 12px; }
  .m2-sidebar-title strong { color: var(--m2-text); font-size: 18px; }
  .m2-nav-link { display: flex; align-items: center; min-height: 46px; padding: 10px 12px; border: 1px solid transparent; border-radius: 8px; color: var(--m2-muted) !important; text-decoration: none; font-weight: 700; }
  .m2-nav-link:hover, .m2-nav-link:focus-visible, .m2-nav-link.active { border-color: rgba(24, 215, 242, .58); color: var(--m2-cyan) !important; background: rgba(24, 215, 242, .12); }
  .m2-shell { width: min(1440px, 100%); min-width: 0; margin: 0 auto; padding: 24px 28px 48px; }
  .m2-submenu-categories { display: grid; max-height: 320px; overflow-y: auto; }
  .m2-submenu-label { padding: 10px 12px 4px; color: var(--m2-muted); font-size: 11px; }
  .m2-page-head, .m2-toolbar, .m2-actions, .m2-status-line, .m2-item-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .m2-page-head { justify-content: space-between; margin-bottom: 18px; }
  .m2-service-menu { position: relative; align-self: center; }
  .m2-service-menu summary { cursor: pointer; padding: 7px 10px; list-style: none; font-size: 19px; }
  .m2-service-menu a { display: block; position: absolute; right: 0; z-index: 4; min-width: 130px; padding: 10px; background: var(--m2-surface-raised); border: 1px solid var(--m2-line); }
  .m2-page-head h1 { margin: 0; font-size: 25px; letter-spacing: 0; }
  .m2-page-head p { margin: 5px 0 0; color: var(--m2-muted); }
  .m2-eyebrow { color: var(--m2-green); font-size: 12px; font-weight: 800; text-transform: uppercase; }
  .m2-badge, .m2-status, .m2-count {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 3px 8px;
    border: 1px solid var(--m2-line);
    border-radius: 999px;
    color: var(--m2-muted);
    font-size: 12px;
    white-space: nowrap;
  }
  .m2-status[data-status="DRAFT"] { border-color: #64748b; color: #cbd5e1; }
  .m2-status[data-status="REVIEW"] { border-color: var(--m2-amber); color: var(--m2-amber); }
  .m2-status[data-status="ACTIVE"] { border-color: var(--m2-green); color: var(--m2-green); }
  .m2-status[data-status="ARCHIVED"] { color: #7f8b98; }
  .m2-panel { border: 1px solid var(--m2-line); border-radius: 8px; background: var(--m2-surface); }
  .m2-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--m2-line); }
  .m2-panel-head h2 { margin: 0; font-size: 16px; letter-spacing: 0; }
  .m2-panel-body { padding: 16px; }
  .m2-toolbar { justify-content: space-between; margin-bottom: 12px; }
  .m2-work-queues { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 10px; margin-bottom: 16px; }
  .m2-work-queue { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 12px 14px; border: 1px solid var(--m2-line); border-radius: 5px; background: var(--m2-surface); color: var(--m2-text); text-decoration: none; }
  .m2-work-queue:hover, .m2-work-queue:focus-visible { border-color: var(--m2-cyan); }
  .m2-work-queue strong { color: var(--m2-cyan); font-size: 20px; }
  .m2-filter { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr)); gap: 8px; flex: 1 1 620px; min-width: 0; }
  input, select, textarea, button { font: inherit; }
  input, select, textarea {
    width: 100%;
    min-height: 38px;
    border: 1px solid var(--m2-line);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--m2-text);
    background: #0b111a;
  }
  textarea { min-height: 82px; resize: vertical; }
  label { display: grid; gap: 5px; color: var(--m2-muted); font-size: 12px; }
  label > span { color: var(--m2-muted); }
  .m2-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    border: 1px solid var(--m2-line);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--m2-text);
    background: #182231;
    cursor: pointer;
    text-decoration: none;
    font-weight: 700;
  }
  .m2-button.primary { border-color: #229755; background: #17683d; }
  .m2-button.warn { border-color: #a97816; color: #ffe29a; background: #49330c; }
  .m2-button.danger { border-color: #943b51; color: #ffc0ce; background: #421724; }
  .m2-button.ghost { background: transparent; }
  .m2-button:disabled { cursor: not-allowed; opacity: .45; }
  .m2-icon-button { width: 36px; min-width: 36px; padding: 6px; font-size: 17px; }
  .m2-table-wrap { overflow-x: auto; }
  .m2-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .m2-table th, .m2-table td { padding: 11px 12px; border-bottom: 1px solid var(--m2-line); text-align: left; vertical-align: top; }
  .m2-table th { color: var(--m2-muted); font-size: 11px; text-transform: uppercase; background: #111925; }
  .m2-table tbody tr:last-child td { border-bottom: 0; }
  .m2-table tbody tr:hover { background: #141e2b; }
  .m2-registry-table tbody tr { position: relative; }
  .m2-registry-table .m2-name-link::after { content: ""; position: absolute; inset: 0; }
  .m2-registry-table tbody tr:focus-within { outline: 2px solid var(--m2-cyan); outline-offset: -2px; }
  .m2-default-table { min-width: 1040px; }
  .m2-default-table th:nth-child(2), .m2-default-table td:nth-child(2) { min-width: 170px; }
  .m2-default-table th:nth-child(7), .m2-default-table td:nth-child(7) { min-width: 240px; }
  .m2-code-detail { display: block; margin-top: 4px; color: var(--m2-muted); font-size: 11px; }
  .m2-default-dialog form { padding: 18px; }
  .m2-default-dialog h3 { margin: 0 0 9px; font-size: 17px; }
  .m2-default-dialog p { margin: 0 0 16px; color: var(--m2-muted); line-height: 1.4; }
  .m2-default-dialog label { display: grid; gap: 6px; }
  .m2-name-link { color: var(--m2-cyan); font-weight: 800; text-decoration: none; }
  .m2-code { color: var(--m2-muted); font-family: Consolas, monospace; font-size: 12px; }
  .m2-technical { margin-top: 5px; color: var(--m2-muted); font-size: 11px; }
  .m2-technical summary { width: fit-content; color: var(--m2-muted); cursor: pointer; }
  .m2-material-head, .m2-material-row { display: grid; grid-template-columns: minmax(160px, 1.4fr) repeat(4, minmax(105px, 1fr)) minmax(80px, .7fr); gap: 12px; align-items: center; }
  .m2-material-head { padding: 0 12px; color: var(--m2-muted); font-size: 11px; }
  .m2-material-row { padding: 12px; }
  .m2-material-row > * { min-width: 0; overflow-wrap: anywhere; }
  .m2-alert { margin-bottom: 14px; border: 1px solid; border-radius: 7px; padding: 11px 13px; }
  .m2-alert.good { border-color: #247c4c; color: #b9f6ce; background: #10291d; }
  .m2-alert.warn { border-color: #85631c; color: #ffe3a3; background: #2b220f; }
  .m2-alert.bad { border-color: #8d354a; color: #ffc3d0; background: #32121b; }
  .m2-empty { padding: 28px 16px; color: var(--m2-muted); text-align: center; }
  .m2-form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .m2-form-grid .wide { grid-column: span 2; }
  .m2-form-grid .full { grid-column: 1 / -1; }
  .m2-form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .m2-check { display: flex; align-items: center; gap: 8px; min-height: 38px; color: var(--m2-text); }
  .m2-check input { width: 18px; min-height: 18px; }
  .m2-tabs { position: sticky; top: 58px; z-index: 30; display: flex; gap: 4px; overflow-x: auto; margin: 0 -24px 16px; padding: 10px 24px; border-block: 1px solid var(--m2-line); background: #090f18; }
  .m2-tabs a { padding: 7px 10px; border-radius: 5px; color: var(--m2-muted); text-decoration: none; white-space: nowrap; }
  .m2-tabs a:hover { color: var(--m2-text); background: var(--m2-surface-raised); }
  .m2-tabs a.active { color: var(--m2-text); background: var(--m2-surface-raised); box-shadow: inset 0 -2px 0 #18d7f2; }
  .m2-section { scroll-margin-top: 112px; margin-bottom: 14px; }
  .m2-records { display: grid; gap: 0; }
  .m2-record-head { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, .8fr) minmax(0, 1fr) minmax(0, .6fr); gap: 12px; padding: 0 12px; color: var(--m2-muted); font-size: 11px; }
  .m2-record { min-width: 0; border-bottom: 1px solid var(--m2-line); background: transparent; }
  .m2-record:last-child { border-bottom: 0; }
  .m2-record-main { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, .8fr) minmax(0, 1fr) minmax(0, .6fr); gap: 12px; align-items: start; padding: 12px; }
  .m2-record-main > * { min-width: 0; overflow-wrap: anywhere; }
  .m2-record-main strong { display: block; margin-bottom: 4px; }
  .m2-cell-label { display: none; }
  .m2-record-main small, .m2-muted { color: var(--m2-muted); }
  .m2-record-detail { padding: 0 12px 12px; color: #cad5dc; line-height: 1.45; }
  .m2-inline-list { margin: 7px 0 0; padding-left: 18px; color: var(--m2-muted); }
  .m2-editor { border-top: 1px solid var(--m2-line); }
  .m2-editor summary { padding: 10px 12px; color: var(--m2-cyan); cursor: pointer; }
  .m2-editor form { padding: 4px 12px 14px; }
  .m2-add { margin-top: 10px; border-top: 1px solid var(--m2-line); }
  .m2-add summary { padding: 12px 16px; color: var(--m2-green); cursor: pointer; font-weight: 700; }
  .m2-add form { padding: 4px 16px 16px; }
  .m2-definition-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--m2-line); }
  .m2-definition { min-height: 82px; padding: 12px; background: var(--m2-surface); }
  .m2-definition span { display: block; margin-bottom: 7px; color: var(--m2-muted); font-size: 11px; text-transform: uppercase; }
  .m2-blocker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .m2-blocker-column { border-left: 3px solid var(--m2-red); padding: 10px 12px; background: #25121a; }
  .m2-blocker-column.warning { border-color: var(--m2-amber); background: #28200f; }
  .m2-blocker-column h3 { margin: 0 0 8px; font-size: 13px; }
  .m2-blocker-column ul { margin: 0; padding-left: 18px; color: #d8e0e5; }
  .m2-validation-ok { margin: 0 0 14px; color: var(--m2-muted); font-size: 13px; }
  dialog { width: min(680px, calc(100vw - 28px)); border: 1px solid var(--m2-line); border-radius: 8px; padding: 0; color: var(--m2-text); background: var(--m2-surface); }
  dialog::backdrop { background: rgba(0, 0, 0, .72); }
  .m2-dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--m2-line); }
  .m2-dialog-head h2 { margin: 0; font-size: 17px; }
  .m2-dialog-body { padding: 16px; }
  [hidden] { display: none !important; }
  @media (min-width: 981px) {
    .m2-readonly-records .m2-record-head, .m2-readonly-records .m2-record-main { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, .8fr) minmax(0, 1fr); }
    .m2-readonly-materials .m2-material-head, .m2-readonly-materials .m2-material-row { grid-template-columns: minmax(0, 1.4fr) repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 980px) {
    .m2-layout { grid-template-columns: 1fr; }
    .m2-sidebar { position: static; display: flex; flex-wrap: wrap; align-items: center; min-height: 0; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--m2-line); }
    .m2-sidebar-title { padding: 0 10px 0 0; }
    .m2-sidebar-items { display: flex; flex-wrap: wrap; gap: 8px; }
    .m2-nav-group { min-width: 190px; }
    .m2-nav-link { min-height: 36px; padding: 7px 10px; }
    .m2-form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .m2-record-main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .m2-record-head { display: none; }
    .m2-cell-label { display: block; margin-bottom: 3px; color: var(--m2-muted); font-size: 11px; }
    .m2-material-head { display: none; }
    .m2-material-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .m2-material-row [data-label]::before { display: block; margin-bottom: 3px; color: var(--m2-muted); font-size: 11px; content: attr(data-label); }
    .m2-definition-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 740px) {
    .m2-sidebar { display: flex; justify-content: space-between; }
    .m2-mobile-menu { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 7px 10px; color: var(--m2-text); background: transparent; border: 1px solid var(--m2-line); border-radius: 5px; cursor: pointer; }
    .m2-sidebar-items { display: none; flex-basis: 100%; }
    .m2-sidebar-items[data-open="true"] { display: grid; }
  }
  @media (max-width: 680px) {
    .m2-shell { padding: 14px 12px 36px; }
    .m2-sidebar-title { width: auto; }
    .m2-filter, .m2-form-grid, .m2-blocker-grid, .m2-definition-grid { grid-template-columns: 1fr; }
    .m2-form-grid .wide, .m2-form-grid .full { grid-column: auto; }
    .m2-tabs { margin-inline: -12px; padding-inline: 12px; }
    .m2-record-main { grid-template-columns: 1fr; }
    .m2-material-row { grid-template-columns: 1fr; }
  }
</style>
