{% macro module1_shell(active_tab, title, subtitle='') -%}
<style>
  .module1-shell {
    border-bottom: 1px solid var(--line, rgba(125,156,255,.22));
    background: rgba(10,16,38,.9);
    backdrop-filter: blur(18px);
    padding: 14px 24px 12px;
    position: sticky;
    top: 0;
    z-index: 6;
  }
  .module1-shell-inner {
    width: min(1480px, 100%);
    margin: 0 auto;
    display: grid;
    gap: 12px;
  }
  .module1-shell-title {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .module1-shell-mark {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border: 1px solid rgba(16,215,232,.48);
    border-radius: 50%;
    background: rgba(7,13,33,.72);
    color: var(--accent, #10d7e8);
    font-weight: 800;
  }
  .module1-shell h1 {
    margin: 0 0 3px;
    font-size: 21px;
    line-height: 1.15;
  }
  .module1-shell-subtitle {
    color: var(--muted, #95a3c6);
    line-height: 1.35;
  }
  .module1-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .module1-tabs::-webkit-scrollbar { width: 0; height: 0; }
  .module1-tabs a {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    padding: 7px 10px;
    border: 1px solid rgba(125,156,255,.24);
    border-radius: 7px;
    background: rgba(7,13,33,.58);
    color: var(--text, #eef6ff);
    text-decoration: none;
    font-weight: 700;
    white-space: nowrap;
  }
  .module1-tabs a:hover,
  .module1-tabs a:focus-visible {
    border-color: rgba(16,215,232,.62);
    background: rgba(16,215,232,.10);
    outline: none;
  }
  .module1-tabs a[aria-current="page"] {
    border-color: rgba(16,215,232,.78);
    background: linear-gradient(135deg, rgba(16,215,232,.22), rgba(79,124,255,.18));
    color: #dffcff;
  }
  @media (max-width: 820px) {
    .module1-shell { padding-left: 14px; padding-right: 14px; }
    .module1-shell h1 { font-size: 19px; }
  }
</style>
<header class="module1-shell" data-module1-shell="true">
  <div class="module1-shell-inner">
    <div class="module1-shell-title">
      <div class="module1-shell-mark">1</div>
      <div>
        <h1>{{ title }}</h1>
        {% if subtitle %}<div class="module1-shell-subtitle">{{ subtitle }}</div>{% endif %}
      </div>
    </div>
    <nav class="module1-tabs" aria-label="Навигация Module №1" data-module1-tabs>
      <a data-module1-tab="overview" href="/api/v1/admin/material-hub/view" {% if active_tab == 'overview' %}aria-current="page"{% endif %}>Обзор</a>
      <a data-module1-tab="materials" href="/api/v1/admin/material-hub/view/materials" {% if active_tab == 'materials' %}aria-current="page"{% endif %}>Материалы</a>
      <a data-module1-tab="documents" href="/api/v1/admin/material-hub/view/documents" {% if active_tab == 'documents' %}aria-current="page"{% endif %}>Документы и технические данные</a>
      <a data-module1-tab="work-costs" href="/api/v1/admin/material-hub/view/work-costs" {% if active_tab == 'work-costs' %}aria-current="page"{% endif %}>Стоимость работ</a>
      <a data-module1-tab="sources" href="/api/v1/admin/material-hub/view/sources" {% if active_tab == 'sources' %}aria-current="page"{% endif %}>Источники и анализатор</a>
      <a data-module1-tab="moderation" href="/api/v1/admin/material-hub/view/moderation" {% if active_tab == 'moderation' %}aria-current="page"{% endif %}>Модерация и качество</a>
    </nav>
  </div>
</header>
{%- endmacro %}
