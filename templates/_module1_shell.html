{% macro module1_shell(active_tab, title='', subtitle='') -%}
<header class="module1-shell" data-module1-shell="true">
  <div class="module1-shell-inner">
    <nav class="module1-tabs" aria-label="Навигация Module №1" data-module1-tabs>
      <a data-module1-tab="overview" href="/api/v1/admin/material-hub/view" {% if active_tab == 'overview' %}aria-current="page"{% endif %}>Обзор</a>
      <a data-module1-tab="materials" href="/api/v1/admin/material-hub/view/materials" {% if active_tab == 'materials' %}aria-current="page"{% endif %}>Материалы</a>
      <a data-module1-tab="documents" href="/api/v1/admin/material-hub/view/documents" {% if active_tab == 'documents' %}aria-current="page"{% endif %}>Документы и технические данные</a>
      <a data-module1-tab="work-costs" href="/api/v1/admin/material-hub/view/work-costs" {% if active_tab == 'work-costs' %}aria-current="page"{% endif %}>Стоимость работ</a>
      <a data-module1-tab="sources" href="/api/v1/admin/material-hub/view/sources" {% if active_tab == 'sources' %}aria-current="page"{% endif %}>Источники и анализатор</a>
      <a data-module1-tab="moderation" href="/api/v1/admin/material-hub/view/moderation" {% if active_tab == 'moderation' %}aria-current="page"{% endif %}>Модерация и качество</a>
    </nav>
  </div>
</header>
<aside class="module1-quick-actions-rail" data-module1-quick-actions-rail aria-label="Быстрые действия Module №1">
  <div class="module1-rail-head">
    <div class="module1-rail-title">Быстрые действия</div>
    <button class="module1-rail-toggle" type="button" data-module1-rail-toggle aria-label="Свернуть или развернуть быстрые действия" aria-controls="module1-quick-actions-content" aria-expanded="true">›</button>
  </div>
  <div
    id="module1-quick-actions-content"
    class="atom-module-quick-actions module1-quick-actions-rail-list"
    data-quick-action-module-bar="MODULE_01_MATERIAL_HUB"
    aria-label="Быстрые действия Module №1">
    <div class="atom-module-quick-actions-empty">Быстрые действия не настроены</div>
  </div>
</aside>
{% include "_atom_quick_action_menu.html" %}
{%- endmacro %}
