<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · АТОМ</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #090d16;
      color: #f4f7fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #090d16;
    }
    main {
      width: min(420px, 100%);
      border: 1px solid #2b3444;
      border-radius: 8px;
      background: #111722;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      overflow: hidden;
    }
    header {
      padding: 24px 24px 18px;
      border-bottom: 1px solid #252e3c;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    p {
      margin: 8px 0 0;
      color: #9aa8bc;
      font-size: 14px;
      line-height: 1.45;
    }
    form {
      display: grid;
      gap: 16px;
      padding: 24px;
    }
    label {
      display: grid;
      gap: 7px;
      color: #dce4ef;
      font-size: 13px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid #39465a;
      border-radius: 6px;
      padding: 9px 11px;
      background: #0c121c;
      color: #f4f7fb;
      font: inherit;
      letter-spacing: 0;
      outline: none;
    }
    input:focus {
      border-color: #3da9fc;
      box-shadow: 0 0 0 3px rgba(61, 169, 252, 0.16);
    }
    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 10px 16px;
      background: #1988df;
      color: #fff;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0;
      cursor: pointer;
    }
    button:hover { background: #2699ed; }
    button:focus-visible {
      outline: 3px solid rgba(61, 169, 252, 0.34);
      outline-offset: 2px;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.68;
    }
    [role="alert"] {
      min-height: 20px;
      margin: 0;
      color: #ff8f8f;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Вход в АТОМ</h1>
      <p>Используйте учётную запись администратора платформы.</p>
    </header>
    <form id="login-form" novalidate>
      <label>
        Email
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      </label>
      <label>
        Пароль
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" role="alert" aria-live="polite"></p>
      <button id="login-submit" type="submit">Войти</button>
    </form>
  </main>
  <script>
    (() => {
      const nextPath = {{ next_path | tojson }};
      const form = document.getElementById("login-form");
      const error = document.getElementById("login-error");
      const submit = document.getElementById("login-submit");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        submit.disabled = true;
        try {
          const response = await fetch("/api/v1/auth/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value,
            }),
          });
          if (!response.ok) {
            error.textContent = response.status === 401
              ? "Неверный email или пароль."
              : "Не удалось выполнить вход. Повторите попытку.";
            return;
          }
          window.location.assign(nextPath);
        } catch (_error) {
          error.textContent = "Сервер недоступен. Проверьте подключение.";
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
